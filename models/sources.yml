version: 2

sources:
  - name: raw
    description: CSV files in the raw S3 bucket, declared as Hive tables (every column varchar) by `lakehouse load`.
    database: "{{ env_var('DBT_RAW_CATALOG', 'raw') }}"
    schema: "{{ env_var('DBT_RAW_SCHEMA', 'landing') }}"
    tables:
      - name: customers
      - name: products
      - name: orders
